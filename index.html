
<!DOCTYPE html>

<head>
<meta charset="UTF-8">

>

<style>

/* =========================================================
   NETVISION
   INDEX PRINCIPAL
========================================================= */

:root {

    --bg:
        #03070d;

    --bg-soft:
        #07111d;

    --panel:
        rgba(7, 16, 27, .78);

    --border:
        rgba(255,255,255,.12);

    --blue:
        #1597ff;

    --blue-light:
        #54b9ff;

    --purple:
        #c44cff;

    --green:
        #39ff14;

    --text:
        #f7f9fc;

    --muted:
        #a1adbc;
}


/* =========================================================
   RESET
========================================================= */

* {
    box-sizing:
        border-box;

    margin:
        0;

    padding:
        0;
}


html,
body {

    width:
        100%;

    height:
        100%;

    min-height:
        100%;

    overflow:
        hidden;

    background:
        var(--bg);

    color:
        var(--text);

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}


body {

    position:
        relative;
}


/* =========================================================
   FONDO
========================================================= */

body::before {

    content:
        "";

    position:
        fixed;

    inset:
        0;

    z-index:
        -3;

    background:

        radial-gradient(
            circle at 50% 15%,
            rgba(21,151,255,.12),
            transparent 38%
        ),

        radial-gradient(
            circle at 10% 50%,
            rgba(21,151,255,.08),
            transparent 30%
        ),

        radial-gradient(
            circle at 90% 50%,
            rgba(0,100,255,.08),
            transparent 30%
        ),

        linear-gradient(
            180deg,
            #02050a 0%,
            #030811 50%,
            #02050a 100%
        );
}


/* =========================================================
   EFECTO DECORATIVO
========================================================= */

body::after {

    content:
        "";

    position:
        fixed;

    inset:
        0;

    z-index:
        -2;

    pointer-events:
        none;

    background:

        linear-gradient(
            90deg,
            rgba(0,0,0,.55),
            transparent 20%,
            transparent 80%,
            rgba(0,0,0,.55)
        );
}


/* =========================================================
   BOTONES
========================================================= */

button {

    font-family:
        inherit;

    border:
        0;

    cursor:
        pointer;
}


/* =========================================================
   PANTALLA DE PERFIL
========================================================= */

.profile-screen {

    position:
        fixed;

    inset:
        0;

    z-index:
        1000;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    padding:
        30px;

    background:

        radial-gradient(
            circle at center,
            rgba(15,31,48,.95),
            rgba(2,5,9,.99) 70%
        );

    transition:
        opacity .35s ease,
        visibility .35s ease;
}


.profile-screen.hidden {

    opacity:
        0;

    visibility:
        hidden;

    pointer-events:
        none;
}


.profile-container {

    width:
        min(900px, 100%);

    text-align:
        center;
}


.profile-brand {

    color:
        var(--blue-light);

    font-size:
        15px;

    font-weight:
        900;

    letter-spacing:
        4px;

    margin-bottom:
        20px;
}


.profile-container h1 {

    font-size:
        clamp(30px, 5vw, 54px);

    line-height:
        1.05;

    font-weight:
        800;

    margin-bottom:
        12px;
}


.profile-subtitle {

    color:
        var(--muted);

    font-size:
        16px;

    margin-bottom:
        45px;
}


/* =========================================================
   PERFILES
========================================================= */

.profile-list {

    display:
        flex;

    align-items:
        flex-start;

    justify-content:
        center;

    gap:
        55px;

    flex-wrap:
        wrap;
}


.profile-item {

    width:
        170px;

    background:
        transparent;

    color:
        white;

    transition:
        transform .2s ease;
}


.profile-item:hover {

    transform:
        translateY(-8px);
}


.profile-avatar {

    width:
        130px;

    height:
        130px;

    margin:
        0 auto 15px;

    border-radius:
        50%;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    background:
        linear-gradient(
            135deg,
            #087ee8,
            #59c1ff
        );

    border:
        3px solid
        rgba(255,255,255,.12);

    box-shadow:
        0 0 45px
        rgba(21,151,255,.22);

    color:
        white;

    font-size:
        48px;

    font-weight:
        900;
}


.profile-avatar.add {

    background:
        rgba(10,20,31,.9);

    color:
        var(--blue-light);

    border:
        2px dashed
        rgba(84,185,255,.45);

    box-shadow:
        none;
}


.profile-name {

    font-size:
        17px;

    font-weight:
        800;
}


.profile-add {

    color:
        var(--muted);

    font-size:
        12px;

    margin-top:
        4px;
}


/* =========================================================
   APLICACIÓN
========================================================= */

#app {

    width:
        100%;

    height:
        100%;

    min-height:
        100%;

    display:
        none;

    flex-direction:
        column;
}


#app.visible {

    display:
        flex;
}


/* =========================================================
   HEADER
========================================================= */

.navbar {

    flex:
        0 0 88px;

    height:
        88px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        space-between;

    padding:
        0 38px;

    background:
        rgba(2,6,11,.92);

    border-bottom:
        1px solid
        rgba(255,255,255,.08);

    backdrop-filter:
        blur(18px);
}


.logo {

    font-size:
        32px;

    font-weight:
        900;

    letter-spacing:
        1px;

    color:

}


.logo span {

    color:
        var(--blue);
}


/* =========================================================
   PERFIL HEADER
========================================================= */

.profile-button {

    display:
        flex;

    align-items:
        center;

    gap:
        12px;

    padding:
        7px 15px 7px 8px;

    border:
        1px solid

    border-radius:
        40px;

    background:
        rgba(7,15,25,.8);

    color:
        white;

    font-size:
        15px;

}


.profile-button:hover {

    background:

    border-color:

.header-avatar {

    height:
        44px;

        50%;

        flex;

        center;

.profile-arrow {

}


/* =========================================================
   MENÚ PRINCIPAL

.main-menu {

.hero h1 {

/* =========================================================

.menu-cards {

.menu-card {

}


.menu-card::before {

    content:

    position:
        absolute;

    inset:
        0;

    background:
        radial-gradient(

}


.menu-card:hover {

    --card-shadow:
        rgba(57,255,20,.12);

/* =========================================================
   ICONO
========================================================= */

.menu-icon {

    width:
        125px;

    height:
        125px;

    margin-bottom:
        20px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    color:

}


.menu-icon svg {

    width:

    height:
        105px;

    stroke:
        currentColor;

    fill:
        none;

    stroke-width:
        2;

    stroke-linecap:
        round;

    stroke-linejoin:
        round;

    filter:
        drop-shadow(
            0 0 12px

.menu-card h2 {

    position:
        relative;

    z-index:
        1;

        32px;

    font-weight:

    margin-bottom:
        8px;

.menu-card p {

    z-index:

/* =========================================================
   FLECHA
========================================================= */

.menu-arrow {

}


.menu-card:hover .menu-arrow {

}


/* =========================================================
   FOOTER
========================================================= */

.footer {

    flex:
        0 0 45px;

    height:

<body>


<!-- =========================================================
     PANTALLA DE PERFILES
========================================================= -->

<section
    class="profile-screen"
    id="profileScreen"
>

    <div class="profile-container">

        <div class="profile-brand">
            NETVISION
        </div>

        <h1>
            ¿Quién está viendo ahora?
        </h1>

        <p class="profile-subtitle">
            Selecciona un perfil para continuar
        </p>


        <div class="profile-list">


            <!-- ALEX -->

            <button
                class="profile-item"
                id="alexProfile"
                type="button"
            >

                <div class="profile-avatar">
                    A
                </div>

                <div class="profile-name">
                    Alex
                </div>

            </button>


            <!-- AGREGAR PERFIL -->

            <button
                class="profile-item"
                id="addProfile"
                type="button"
            >

                <div class="profile-avatar add">
                    +
                </div>

                <div class="profile-name">
                    Agregar perfil
                </div>

                <div class="profile-add">
                    Nuevo perfil
                </div>

            </button>

        </div>

    </div>

</section>

     APLICACIÓN PRINCIPAL
========================================================= -->

         HEADER
    ====================================================== -->

        <div class="logo">
            NET<span>VISION</span>
        </div>


        <button
            class="profile-button"
            id="profileButton"
            type="button"
        >

            <div
                class="header-avatar"
                id="headerAvatar"
            >
                A
            </div>

            <span id="headerProfileName">
                Alex
            </span>

            <span class="profile-arrow">
               ⌄
            </span>

        </button>

<script>

/* =========================================================
   ELEMENTOS
========================================================= */

const profileScreen =
    document.getElementById(
        "profileScreen"
    );


const app =
    document.getElementById(
        "app"
    );


const alexProfile =
    document.getElementById(
        "alexProfile"
    );


const addProfile =
    document.getElementById(
        "addProfile"
    );


const profileButton =
    document.getElementById(
        "profileButton"
    );


const headerAvatar =
    document.getElementById(
        "headerAvatar"
    );


const headerProfileName =
    document.getElementById(
        "headerProfileName"
    );


/* =========================================================
   PERFIL ACTUAL
========================================================= */

let currentProfile =
    sessionStorage.getItem(
        "netvisionProfile"
    );


/* =========================================================
   MOSTRAR APP
========================================================= */

function showApp() {

    profileScreen.classList.add(
        "hidden"
    );


    setTimeout(
        () => {

            profileScreen.style.display =
                "none";

            app.classList.add(
                "visible"
            );

        },
        250
    );


    updateHeader();

}


/* =========================================================
   ACTUALIZAR PERFIL
========================================================= */

function updateHeader() {

    const name =
        currentProfile ||
        "Alex";


    headerProfileName.textContent =
        name;


    headerAvatar.textContent =
        name.charAt(0).toUpperCase();

}


/* =========================================================
   ENTRAR AL SISTEMA
========================================================= */

async function enterWithProfile(
    profileName
) {

    currentProfile =
        profileName;


    sessionStorage.setItem(
        "netvisionProfile",
        profileName
    );


    /*
     * Intentar pantalla completa.
     */

    try {

        if (
            document.documentElement
                .requestFullscreen
        ) {

            await document.documentElement
                .requestFullscreen()
                .catch(
                    () => {}
                );

        }

    } catch (error) {}


    /*
     * Intentar orientación horizontal.
     *
     * Algunos navegadores móviles no
     * permiten bloquear la orientación.
     * Si no lo permiten, el diseño
     * responsive continúa funcionando.
     */

    try {

        if (
            screen.orientation &&
            screen.orientation.lock
        ) {

            await screen.orientation
                .lock(
                    "landscape"
                )
                .catch(
                    () => {}
                );

        }

    } catch (error) {}


    showApp();

}


/* =========================================================
   ALEX
========================================================= */

alexProfile.addEventListener(
    "click",
    () => {

        enterWithProfile(
            "Alex"
        );

    }
);


/* =========================================================
   AGREGAR PERFIL
========================================================= */

addProfile.addEventListener(
    "click",
    () => {

        alert(
            "La creación de perfiles estará disponible próximamente."
        );

    }
);


/* =========================================================
   BOTÓN PERFIL
========================================================= */

profileButton.addEventListener(
    "click",
    () => {

        app.classList.remove(
            "visible"
        );


        profileScreen.style.display =
            "flex";


        requestAnimationFrame(
            () => {

                profileScreen.classList.remove(
                    "hidden"
                );

            }
        );

    }
);


/* =========================================================
   NAVEGACIÓN TV
========================================================= */

function openTV() {

    /*
     * El navegador puede salir de
     * fullscreen al cambiar de página.
     * TV.html se encargará nuevamente
     * de su propia interfaz.
     */

    window.location.href =
        "tv.html";

}


/* =========================================================
   NAVEGACIÓN PELÍCULAS
========================================================= */

function openMovies() {

    window.location.href =
        "peliculas.html";

}


/* =========================================================
   NAVEGACIÓN SERIES
========================================================= */

function openSeries() {

    window.location.href =
        "series.html";

}


/* =========================================================
   INICIO
========================================================= */

function initialize() {

    /*
     * IMPORTANTE:
     * Siempre mostramos primero el selector
     * de perfiles al abrir index.html.
     *
     * Esto mantiene el flujo:
     *
     * PERFIL
     *   ↓
     * MENÚ
     *   ↓
     * TV / PELÍCULAS / SERIES
     */

    app.classList.remove(
        "visible"
    );


    profileScreen.style.display =
        "flex";


    profileScreen.classList.remove(
        "hidden"
    );


    updateHeader();

}


/* =========================================================
   INICIAR
========================================================= */

initialize();


/* =========================================================
   EVITAR SCROLL
========================================================= */

document.addEventListener(
    "touchmove",
    event => {

        /*
         * Solo evitamos el movimiento
         * cuando la página principal
         * está activa.
         */

        if (
            app.classList.contains(
                "visible"
            )
        ) {

            event.preventDefault();

        }

    },
    {
        passive:
            false
    }
);


/* =========================================================
   RESTAURAR ORIENTACIÓN AL SALIR
========================================================= */

window.addEventListener(
    "pagehide",
    () => {

        try {

            if (
                screen.orientation &&
                screen.orientation.unlock
            ) {

                screen.orientation.unlock();

            }

        } catch (error) {}

    }
);

</script>

</body>
</html>


<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>NETVISION</title>

<meta
    name="description"
    content="NETVISION - Todo tu entretenimiento en un solo lugar."
>

<style>

/* =========================================================
   NETVISION
   INDEX PRINCIPAL
========================================================= */

:root {

    --bg: #05080d;
    --panel: #0a1018;
    --panel-2: #0d1520;

    --border:
        rgba(255,255,255,.08);

    --blue:
        #1597ff;

    --blue-light:
        #54b9ff;

    --text:
        #f5f7fb;

    --muted:
        #8995a5;

    --radius:
        14px;
}


/* =========================================================
   RESET
========================================================= */

* {

    box-sizing:
        border-box;

    margin:
        0;

    padding:
        0;

}


html,
body {

    width:
        100%;

    height:
        100%;

    min-height:
        100%;

    overflow:
        hidden;

    background:
        var(--bg);

    color:
        var(--text);

    font-family:
        Arial,
        Helvetica,
        sans-serif;

}


button {

    font-family:
        inherit;

}


/* =========================================================
   APP
========================================================= */

#app {

    width:
        100%;

    height:
        100%;

    min-height:
        100svh;

    position:
        relative;

    overflow:
        hidden;

}


/* =========================================================
   PANTALLA DE PERFILES
========================================================= */

.profile-screen {

    position:
        absolute;

    inset:
        0;

    z-index:
        100;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    padding:
        30px;

    background:
        radial-gradient(
            circle at center,
            #101923 0%,
            #05080d 68%
        );

}


.profile-container {

    width:
        min(850px, 100%);

    text-align:
        center;

}


.profile-brand {

    color:
        var(--blue-light);

    font-size:
        13px;

    font-weight:
        900;

    letter-spacing:
        4px;

    margin-bottom:
        18px;

}


.profile-container h1 {

    font-size:
        clamp(28px, 5vw, 48px);

    font-weight:
        800;

    margin-bottom:
        10px;

}


.profile-subtitle {

    color:
        var(--muted);

    font-size:
        15px;

    margin-bottom:
        40px;

}


.profile-list {

    display:
        flex;

    justify-content:
        center;

    align-items:
        flex-start;

    gap:
        40px;

    flex-wrap:
        wrap;

}


.profile-item {

    width:
        150px;

    border:
        0;

    background:
        transparent;

    color:
        white;

    cursor:
        pointer;

    transition:
        transform .2s ease;

}


.profile-item:hover {

    transform:
        translateY(-6px);

}


.profile-avatar {

    width:
        120px;

    height:
        120px;

    margin:
        0 auto 14px;

    border-radius:
        50%;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    font-size:
        42px;

    font-weight:
        900;

    background:
        linear-gradient(
            135deg,
            #168fff,
            #55c1ff
        );

    color:
        white;

    border:
        3px solid
        rgba(255,255,255,.10);

    box-shadow:
        0 0 35px
        rgba(21,151,255,.20);

}


.profile-avatar.add {

    background:
        #101923;

    color:
        var(--blue-light);

    border:
        2px dashed
        rgba(84,185,255,.45);

}


.profile-name {

    font-size:
        15px;

    font-weight:
        800;

}


.profile-add {

    color:
        var(--muted);

    font-size:
        12px;

    margin-top:
        4px;

}


/* =========================================================
   MENU PRINCIPAL
========================================================= */

.main-screen {

    position:
        absolute;

    inset:
        0;

    display:
        none;

    flex-direction:
        column;

    background:
        var(--bg);

}


/* =========================================================
   HEADER
========================================================= */

.navbar {

    height:
        58px;

    min-height:
        58px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        space-between;

    padding:
        0 28px;

    background:
        #070c13;

    border-bottom:
        1px solid
        var(--border);

}


.logo {

    border:
        0;

    background:
        transparent;

    color:
        white;

    font-size:
        15px;

    font-weight:
        900;

    letter-spacing:
        2px;

}


.logo span {

    color:
        var(--blue-light);

}


.profile-area {

    display:
        flex;

    align-items:
        center;

    gap:
        9px;

    color:
        #dce4ed;

    font-size:
        12px;

}


.small-avatar {

    width:
        30px;

    height:
        30px;

    border-radius:
        50%;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    font-size:
        12px;

    font-weight:
        900;

    background:
        linear-gradient(
            135deg,
            #168fff,
            #55c1ff
        );

}


/* =========================================================
   CONTENIDO PRINCIPAL
========================================================= */

.main-content {

    flex:
        1;

    min-height:
        0;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    padding:
        30px;

}


.main-inner {

    width:
        min(1100px, 100%);

    text-align:
        center;

}


/* =========================================================
   HERO
========================================================= */

.hero-kicker {

    color:
        var(--blue-light);

    font-size:
        11px;

    font-weight:
        900;

    letter-spacing:
        4px;

    margin-bottom:
        12px;

}


.hero-title {

    font-size:
        clamp(34px, 6vw, 68px);

    font-weight:
        900;

    line-height:
        1;

    margin-bottom:
        15px;

}


.hero-title span {

    color:
        var(--blue-light);

}


.hero-description {

    max-width:
        600px;

    margin:
        0 auto 42px;

    color:
        var(--muted);

    font-size:
        15px;

    line-height:
        1.6;

}


/* =========================================================
   OPCIONES
========================================================= */

.content-options {

    display:
        grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap:
        18px;

    width:
        100%;

    max-width:
        900px;

    margin:
        0 auto;

}


.content-card {

    position:
        relative;

    min-height:
        220px;

    padding:
        28px;

    border:
        1px solid
        var(--border);

    border-radius:
        var(--radius);

    background:
        linear-gradient(
            145deg,
            #0d1621,
            #080d14
        );

    color:
        white;

    cursor:
        pointer;

    overflow:
        hidden;

    text-align:
        left;

    transition:
        transform .2s ease,
        border-color .2s ease,
        box-shadow .2s ease;

}


.content-card::after {

    content:
        "";

    position:
        absolute;

    width:
        140px;

    height:
        140px;

    right:
        -45px;

    bottom:
        -45px;

    border-radius:
        50%;

    background:
        rgba(21,151,255,.10);

}


.content-card:hover {

    transform:
        translateY(-6px);

    border-color:
        rgba(84,185,255,.45);

    box-shadow:
        0 15px 40px
        rgba(0,0,0,.35);

}


.content-icon {

    width:
        62px;

    height:
        62px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    border-radius:
        14px;

    background:
        rgba(21,151,255,.12);

    border:
        1px solid
        rgba(84,185,255,.25);

    color:
        var(--blue-light);

    font-size:
        28px;

    margin-bottom:
        22px;

}


.content-card h2 {

    font-size:
        21px;

    margin-bottom:
        8px;

}


.content-card p {

    color:
        var(--muted);

    font-size:
        12px;

    line-height:
        1.5;

}


.content-arrow {

    position:
        absolute;

    right:
        22px;

    bottom:
        20px;

    color:
        var(--blue-light);

    font-size:
        20px;

}


/* =========================================================
   FOOTER
========================================================= */

.main-footer {

    color:
        #586575;

    font-size:
        9px;

    margin-top:
        25px;

}


/* =========================================================
   RESPONSIVE
========================================================= */

@media (max-width: 750px) {

    .navbar {

        height:
            50px;

        min-height:
            50px;

        padding:
            0 14px;

    }


    .logo {

        font-size:
            12px;

    }


    .profile-area {

        font-size:
            9px;

    }


    .small-avatar {

        width:
            26px;

        height:
            26px;

        font-size:
            10px;

    }


    .main-content {

        padding:
            18px 12px;

    }


    .hero-kicker {

        font-size:
            8px;

        letter-spacing:
            2px;

    }


    .hero-title {

        font-size:
            clamp(27px, 9vw, 43px);

    }


    .hero-description {

        font-size:
            11px;

        margin-bottom:
            24px;

    }


    .content-options {

        gap:
            8px;

    }


    .content-card {

        min-height:
            155px;

        padding:
            15px;

        border-radius:
            10px;

    }


    .content-icon {

        width:
            42px;

        height:
            42px;

        border-radius:
            10px;

        font-size:
            19px;

        margin-bottom:
            15px;

    }


    .content-card h2 {

        font-size:
            14px;

    }


    .content-card p {

        font-size:
            8px;

    }


    .content-arrow {

        right:
            12px;

        bottom:
            10px;

        font-size:
            14px;

    }


    .profile-screen {

        padding:
            15px;

    }


    .profile-container h1 {

        font-size:
            27px;

    }


    .profile-subtitle {

        font-size:
            11px;

        margin-bottom:
            25px;

    }


    .profile-list {

        gap:
            18px;

    }


    .profile-item {

        width:
            105px;

    }


    .profile-avatar {

        width:
            80px;

        height:
            80px;

        font-size:
            28px;

    }


    .profile-name {

        font-size:
            12px;

    }


    .profile-add {

        font-size:
            9px;

    }

}


@media (max-width: 420px) {

    .content-card {

        min-height:
            140px;

        padding:
            12px;

    }


    .content-icon {

        width:
            38px;

        height:
            38px;

        font-size:
            17px;

        margin-bottom:
            11px;

    }


    .content-card h2 {

        font-size:
            12px;

    }


    .content-card p {

        font-size:
            7px;

    }


    .hero-description {

        max-width:
            310px;

    }

}

</style>

</head>


<body>


<div id="app">


<!-- =========================================================
     PERFIL
========================================================= -->

<section
    class="profile-screen"
    id="profileScreen"
>

    <div class="profile-container">

        <div class="profile-brand">
            NETVISION
        </div>

        <h1>
            ¿Quién está viendo ahora?
        </h1>

        <p class="profile-subtitle">
            Selecciona un perfil para continuar
        </p>


        <div class="profile-list">

            <button
                class="profile-item"
                id="alexProfile"
                type="button"
            >

                <div class="profile-avatar">
                    A
                </div>

                <div class="profile-name">
                    Alex
                </div>

            </button>


            <button
                class="profile-item"
                id="addProfile"
                type="button"
            >

                <div class="profile-avatar add">
                    +
                </div>

                <div class="profile-name">
                    Agregar perfil
                </div>

                <div class="profile-add">
                    Nuevo perfil
                </div>

            </button>

        </div>

    </div>

</section>


<!-- =========================================================
     MENU PRINCIPAL
========================================================= -->

<section
    class="main-screen"
    id="mainScreen"
>


    <header class="navbar">

        <div class="logo">
            <span>NET</span>VISION
        </div>


        <div
            class="profile-area"
            id="profileButton"
            style="cursor:pointer;"
            title="Cambiar perfil"
        >

            <div
                class="small-avatar"
                id="headerAvatar"
            >
                A
            </div>

            <span id="headerProfileName">
                Alex
            </span>

        </div>

    </header>



    <main class="main-content">

        <div class="main-inner">


            <div class="hero-kicker">
                NETVISION
            </div>


            <h1 class="hero-title">
                Todo tu
                <span>entretenimiento</span>
                en un solo lugar
            </h1>


            <p class="hero-description">
                Elige qué quieres ver y disfruta
                de tus contenidos favoritos.
            </p>


            <div class="content-options">


                <!-- TV -->

                <button
                    class="content-card"
                    id="tvButton"
                    type="button"
                >

                    <div class="content-icon">
                        ▣
                    </div>

                    <h2>
                        TV EN VIVO
                    </h2>

                    <p>
                        Disfruta canales en vivo
                        en tiempo real.
                    </p>

                    <div class="content-arrow">
                        →
                    </div>

                </button>


                <!-- PELÍCULAS -->

                <button
                    class="content-card"
                    id="moviesButton"
                    type="button"
                >

                    <div class="content-icon">
                        ▶
                    </div>

                    <h2>
                        PELÍCULAS
                    </h2>

                    <p>
                        Descubre películas
                        y disfruta de tus favoritas.
                    </p>

                    <div class="content-arrow">
                        →
                    </div>

                </button>


                <!-- SERIES -->

                <button
                    class="content-card"
                    id="seriesButton"
                    type="button"
                >

                    <div class="content-icon">
                        ▤
                    </div>

                    <h2>
                        SERIES
                    </h2>

                    <p>
                        Explora tus series
                        y episodios favoritos.
                    </p>

                    <div class="content-arrow">
                        →
                    </div>

                </button>


            </div>


            <div class="main-footer">
                Selecciona una categoría para comenzar
            </div>

        </div>

    </main>

</section>

</div>


<script>

/* =========================================================
   ELEMENTOS
========================================================= */

const profileScreen =
    document.getElementById(
        "profileScreen"
    );


const mainScreen =
    document.getElementById(
        "mainScreen"
    );


const alexProfile =
    document.getElementById(
        "alexProfile"
    );


const addProfile =
    document.getElementById(
        "addProfile"
    );


const profileButton =
    document.getElementById(
        "profileButton"
    );


const headerProfileName =
    document.getElementById(
        "headerProfileName"
    );


const headerAvatar =
    document.getElementById(
        "headerAvatar"
    );


/* =========================================================
   PERFIL
========================================================= */

function showProfileScreen() {

    profileScreen.style.display =
        "flex";

    mainScreen.style.display =
        "none";

}


function showMainMenu() {

    profileScreen.style.display =
        "none";

    mainScreen.style.display =
        "flex";

    updateProfileUI();

}


/* =========================================================
   ACTUALIZAR PERFIL
========================================================= */

function updateProfileUI() {

    const profile =
        sessionStorage.getItem(
            "netvisionProfile"
        ) || "Alex";


    headerProfileName.textContent =
        profile;


    headerAvatar.textContent =
        profile
            .charAt(0)
            .toUpperCase();

}


/* =========================================================
   SELECCIONAR ALEX
========================================================= */

alexProfile.addEventListener(
    "click",
    async () => {

        sessionStorage.setItem(
            "netvisionProfile",
            "Alex"
        );


        /*
         * Intentamos pantalla completa
         * en teléfonos.
         *
         * Si el navegador no lo permite,
         * simplemente continúa.
         */

        try {

            if (
                document.documentElement
                    .requestFullscreen
            ) {

                await document.documentElement
                    .requestFullscreen()
                    .catch(() => {});

            }

        } catch (error) {}


        try {

            if (
                screen.orientation &&
                screen.orientation.lock
            ) {

                await screen.orientation
                    .lock("landscape")
                    .catch(() => {});

            }

        } catch (error) {}


        showMainMenu();

    }
);


/* =========================================================
   AGREGAR PERFIL
========================================================= */

addProfile.addEventListener(
    "click",
    () => {

        alert(
            "La función para crear perfiles estará disponible próximamente."
        );

    }
);


/* =========================================================
   CAMBIAR PERFIL
========================================================= */

profileButton.addEventListener(
    "click",
    () => {

        sessionStorage.removeItem(
            "netvisionProfile"
        );


        showProfileScreen();

    }
);


/* =========================================================
   TV
========================================================= */

document
    .getElementById("tvButton")
    .addEventListener(
        "click",
        () => {

            window.location.href =
                "tv.html";

        }
    );


/* =========================================================
   PELÍCULAS
========================================================= */

document
    .getElementById("moviesButton")
    .addEventListener(
        "click",
        () => {

            window.location.href =
                "peliculas.html";

        }
    );


/* =========================================================
   SERIES
========================================================= */

document
    .getElementById("seriesButton")
    .addEventListener(
        "click",
        () => {

            window.location.href =
                "series.html";

        }
    );


/* =========================================================
   INICIO
========================================================= */

function initialize() {

    const savedProfile =
        sessionStorage.getItem(
            "netvisionProfile"
        );


    /*
     * Si ya existe perfil:
     *
     * NO mostramos perfiles.
     *
     * Esto evita:
     *
     * TV → INICIO → PERFIL
     *
     * y permite:
     *
     * TV → INICIO → MENU
     */

    if (savedProfile) {

        showMainMenu();

    } else {

        showProfileScreen();

    }

}


initialize();

</script>

</body>
</html>
